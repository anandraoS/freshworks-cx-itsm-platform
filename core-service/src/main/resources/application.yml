server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: core-service
  profiles:
    # Default runtime is "local" (H2 in PostgreSQL mode, Caffeine, in-memory event dispatch). Override with
    # SPRING_PROFILES_ACTIVE=docker for PostgreSQL + Redis + RabbitMQ.
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway
    properties:
      hibernate:
        jdbc.batch_size: 50
        default_batch_fetch_size: 32
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: core-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # key=value structured line; correlationId / tenantId / userId come from the MDC. Request bodies/headers are never logged.
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%-5level corr=%X{correlationId:-} tenant=%X{tenantId:-} user=%X{userId:-} logger=%logger{32} msg=\"%replace(%msg){'\"','\\\\\"'}\"%n%wEx"
  level:
    root: INFO
    org.hibernate.SQL: WARN

cx:
  cors:
    # comma-separated list; React dev (5173) and Angular dev (4200) by default. Override with CX_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CX_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
  security:
    jwt:
      # Clearly dummy development secret (see CxProperties.DEV_JWT_SECRET). The docker profile REFUSES to start with it.
      secret: ${CX_JWT_SECRET:dev-only-NOT-A-REAL-SECRET-change-me-0123456789abcdef}
      ttl-minutes: 60
    login-rate:
      capacity: ${CX_LOGIN_RATE_CAPACITY:10}
      refill-per-minute: ${CX_LOGIN_RATE_REFILL_PER_MIN:5}
      max-tracked-keys: 10000
  seed:
    enabled: false
  outbox:
    relay-enabled: true
    poll-ms: 1000
    batch-size: 50
    max-attempts: 8
    # housekeeping: delivered (SENT) rows older than retention-days are deleted in bounded batches (FAILED rows are kept)
    purge-enabled: true
    retention-days: 7
    purge-batch-size: 500
    purge-max-batches-per-run: 20
    purge-interval-ms: 3600000
  sla:
    job-enabled: true
    job-interval-ms: 60000
    batch-per-tenant: 200
  # Document store for version snapshots / AI metadata: jpa (default, table document_store) | memory | mongo (docker profile)
  docstore: jpa
  ai:
    # mock = deterministic rule-based provider (default, no network). http = optional real provider stub (AI_API_URL / AI_API_KEY, both empty by default).
    provider: ${AI_PROVIDER:${CX_AI_PROVIDER:mock}}
    http:
      url: ${AI_API_URL:${CX_AI_API_BASE_URL:}}
      api-key: ${AI_API_KEY:${CX_AI_API_KEY:}}
    timeout-ms: 3000
    max-retries: 2            # retries after the first attempt (hard cap 3)
    total-deadline-ms: 10000
    rate-limit-per-minute: 30 # per tenant, per node
    breaker-failures: 5
    breaker-open-ms: 30000
    fault-mode: NONE          # TEST HOOK only: NONE | FAIL | TIMEOUT (refused in the docker profile)
