server:
  port: 8080
spring:
  application:
    name: gateway
routes:
  core:
    uri: ${CORE_URI:http://localhost:8081}
  # local default = core (notifications embedded in core-service); docker sets http://notification-service:8082
  notifications:
    uri: ${NOTIFICATIONS_URI:${routes.core.uri}}
cx:
  security:
    jwt:
      secret: ${CX_JWT_SECRET:dev-only-NOT-A-REAL-SECRET-change-me-0123456789abcdef}
gateway:
  jwt:
    secret: ${cx.security.jwt.secret}
  rate-limit:
    enabled: true
    capacity: ${GATEWAY_RATE_CAPACITY:100}
    refill-per-second: ${GATEWAY_RATE_REFILL_PER_SEC:20}
  upstream:
    connect-timeout-ms: 2000
    response-timeout-ms: 30000
management:
  # Actuator on an internal port by default (secure default: /actuator/prometheus is not on the public port).
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gateway
logging:
  level:
    com.example.cx: ${CX_LOG_LEVEL:INFO}
